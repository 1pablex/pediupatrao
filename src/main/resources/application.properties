# Variaveis locais (conexao e senhas iniciais) ficam no arquivo .env na raiz do projeto, fora do Git.
# Use o .env.example como modelo.
spring.config.import=optional:file:.env[.properties]

# Conexão com o MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao}
spring.data.mongodb.auto-index-creation=true

# Senhas dos usuários criados na primeira execução (admin, gerente01, atendente01)
app.seed.senha-admin=${SEED_SENHA_ADMIN:}
app.seed.senha-gerente=${SEED_SENHA_GERENTE:}
app.seed.senha-atendente=${SEED_SENHA_ATENDENTE:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Não expor detalhes internos nas respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

logging.level.com.umc.pediupatrao=INFO
