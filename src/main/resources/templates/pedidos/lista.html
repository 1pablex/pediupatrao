<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Pedidos</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Entrada</th>
                        <th>Cliente</th>
                        <th>Tipo</th>
                        <th class="text-center">Itens</th>
                        <th class="text-end">Total</th>
                        <th>Status</th>
                        <th>Saída</th>
                        <th class="text-end pe-4"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4">
                            <div th:text="${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')}"></div>
                            <small class="text-muted" th:text="${pedido.responsavelEntrada}"></small>
                        </td>
                        <td th:text="${pedido.nomeCliente}"></td>
                        <td th:text="${pedido.tipoEntrega?.descricao}"></td>
                        <td class="text-center" th:text="${pedido.quantidadeTotalItens}"></td>
                        <td class="text-end fw-medium"
                            th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|"></td>
                        <td>
                            <span class="badge" th:classappend="${pedido.status.corBadge}"
                                  th:text="${pedido.status.descricao}"></span>
                        </td>
                        <td>
                            <th:block th:if="${pedido.dataHoraSaida != null}">
                                <div th:text="${#temporals.format(pedido.dataHoraSaida, 'dd/MM/yyyy HH:mm')}"></div>
                                <small class="text-muted" th:text="${pedido.responsavelSaida}"></small>
                            </th:block>
                            <span class="text-muted" th:if="${pedido.dataHoraSaida == null}">—</span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> Detalhes
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>
</div>
</body>
</html>
