<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-shield-check me-2 text-primary"></i>Auditoria
        </h2>
        <span class="text-muted small" th:text="|${registros.totalElements} registro(s)|"></span>
    </div>
    <p class="text-muted small mb-4">
        Registros somente leitura. Telefones são exibidos mascarados e senhas nunca são registradas.
    </p>

    <!-- Filtros -->
    <form th:action="@{/auditoria}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-sm-4 col-md-3">
            <label for="entidade" class="form-label small mb-1">Entidade</label>
            <select id="entidade" name="entidade" class="form-select form-select-sm">
                <option value="">Todas</option>
                <option th:each="e : ${entidades}" th:value="${e}" th:text="${e.descricao}"
                        th:selected="${e == entidadeSelecionada}"></option>
            </select>
        </div>
        <div class="col-sm-5 col-md-4">
            <label for="entidadeId" class="form-label small mb-1">ID do registro</label>
            <input type="text" id="entidadeId" name="entidadeId" class="form-control form-control-sm"
                   th:value="${entidadeId}" placeholder="Ex: id do pedido ou do cliente">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-funnel me-1"></i>Filtrar</button>
            <a th:href="@{/auditoria}" class="btn btn-sm btn-outline-secondary">Limpar</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:replace="~{auditoria/lista :: tabela(${registros.content})}"></div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center" th:if="${registros.totalPages > 1}">
            <a class="btn btn-sm btn-outline-secondary" th:classappend="${registros.first} ? 'disabled'"
               th:href="@{/auditoria(entidade=${entidadeSelecionada}, entidadeId=${entidadeId}, pagina=${registros.number - 1})}">
                <i class="bi bi-chevron-left"></i> Anterior
            </a>
            <span class="small text-muted" th:text="|Página ${registros.number + 1} de ${registros.totalPages}|"></span>
            <a class="btn btn-sm btn-outline-secondary" th:classappend="${registros.last} ? 'disabled'"
               th:href="@{/auditoria(entidade=${entidadeSelecionada}, entidadeId=${entidadeId}, pagina=${registros.number + 1})}">
                Próxima <i class="bi bi-chevron-right"></i>
            </a>
        </div>
    </div>
</div>

<!-- Tabela de registros, reutilizada na tela de detalhes do pedido -->
<table th:fragment="tabela(lista)" class="table table-sm table-hover align-middle mb-0">
    <thead class="table-dark">
        <tr>
            <th class="ps-3">Data e hora</th>
            <th>Usuário</th>
            <th>Operação</th>
            <th>Registro</th>
            <th>Campos alterados (anterior → novo)</th>
            <th>Justificativa</th>
        </tr>
    </thead>
    <tbody>
        <tr th:if="${#lists.isEmpty(lista)}">
            <td colspan="6" class="text-center text-muted py-4">Nenhum registro de auditoria.</td>
        </tr>
        <tr th:each="r : ${lista}">
            <td class="ps-3 text-nowrap" th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
            <td class="text-nowrap">
                <span th:text="${r.usuario}"></span>
                <span class="badge bg-light text-dark border" th:text="${r.perfil}"></span>
            </td>
            <td th:text="${r.operacaoDescricao}"></td>
            <td class="small">
                <span th:text="${r.entidade.descricao}"></span><br>
                <a th:if="${r.entidade.name() == 'PEDIDO'}" th:href="@{/pedidos/{id}(id=${r.entidadeId})}"
                   class="text-muted" th:text="${r.entidadeId}"></a>
                <span th:unless="${r.entidade.name() == 'PEDIDO'}" class="text-muted" th:text="${r.entidadeId}"></span>
            </td>
            <td class="small">
                <div th:each="a : ${r.alteracoes}">
                    <strong th:text="${a.campo}"></strong>:
                    <span class="text-danger" th:text="${a.valorAnterior} ?: '-'"></span>
                    →
                    <span class="text-success" th:text="${a.valorNovo} ?: '-'"></span>
                </div>
            </td>
            <td class="small" th:text="${r.justificativa} ?: '-'"></td>
        </tr>
    </tbody>
</table>
</body>
</html>
