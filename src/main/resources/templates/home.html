<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Home</title>
</head>
<body>

<div class="container-fluid py-5 d-flex justify-content-center" th:fragment="content">
    <div class="text-center">
        <h1>Bem-vindo, <span sec:authentication="name"></span>!</h1>
        <p class="text-muted" sec:authorize="hasRole('ADMIN')">
            Perfil ADMIN: administre usuários, consulte pedidos e acompanhe a auditoria.
        </p>
        <p class="text-muted" sec:authorize="hasRole('GERENTE')">
            Perfil GERENTE: gerencie pedidos, aplique descontos, cancele pedidos e acompanhe a auditoria.
        </p>
        <p class="text-muted" sec:authorize="hasRole('ATENDENTE')">
            Perfil ATENDENTE: cadastre clientes, registre pedidos e acompanhe o andamento.
        </p>
        <img th:src="@{/images/logo.png}" alt="Logo" width="360" height="360" class="img-fluid">
    </div>
</div>

</body>
</html>
